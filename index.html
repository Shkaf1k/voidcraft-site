<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvivalInKaif — Minecraft Server</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #22c55e;
            --accent-hover: #16a34a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .server-ip-box {
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #333;
            margin-bottom: 40px;
        }

        .ip-text {
            font-size: 1.2rem;
            font-weight: bold;
            font-family: monospace;
        }

        .btn-copy {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background-color: var(--accent-hover);
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #2d2d35;
        }

        .card h3 {
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .card .date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .admin-panel {
            margin-top: 50px;
            background: #18181c;
            padding: 20px;
            border-radius: 10px;
            border: 1px dashed var(--accent-color);
            width: 100%;
            max-width: 800px;
        }

        .admin-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .admin-panel form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-panel input, .admin-panel textarea, .admin-panel select {
            background: #0f0f11;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
        }

        .admin-panel button {
            background: var(--accent-color);
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            background: var(--accent-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>SurvivalInKaif</h1>
        <p>Официальный сайт сервера Minecraft</p>
    </header>

    <div class="server-ip-box">
        <span class="ip-text" id="serverIp">SurvivalInKaif.aternos.me:50723</span>
        <button class="btn-copy" onclick="copyIp()">Скопировать IP</button>
    </div>

    <div class="container">
        <h2 class="section-title">Новости и Ивенты</h2>
        <div id="postsContainer"></div>
    </div>

    <!-- Панель администратора (сохраняет записи в браузере) -->
    <div class="admin-panel">
        <h2>Панель управления (для владельца)</h2>
        <form id="addPostForm">
            <input type="text" id="postTitle" placeholder="Заголовок новости/ивента" required>
            <select id="postType">
                <option value="Новость">Новость</option>
                <option value="Ивент">Ивент</option>
            </select>
            <textarea id="postContent" rows="4" placeholder="Текст объявления..." required></textarea>
            <button type="submit">Опубликовать</button>
        </form>
    </div>

    <div class="toast" id="toast">IP скопирован в буфер обмена!</div>

    <script>
        const defaultPosts = [
            {
                title: "Открытие сервера!",
                type: "Новость",
                date: "20.09.2026",
                content: "Добро пожаловать на сервер SurvivalInKaif! Подключайтесь по IP выше и играйте вместе с нами."
            }
        ];

        function loadPosts() {
            const saved = localStorage.getItem('server_posts');
            const posts = saved ? JSON.parse(saved) : defaultPosts;
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            posts.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>[${post.type}] ${post.title}</h3>
                    <div class="date">${post.date}</div>
                    <p>${post.content}</p>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById('addPostForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('postTitle').value;
            const type = document.getElementById('postType').value;
            const content = document.getElementById('postContent').value;
            const date = new Date().toLocaleDateString('ru-RU');

            const saved = localStorage.getItem('server_posts');
            const posts = saved ? JSON.parse(saved) : [...defaultPosts];

            posts.unshift({ title, type, date, content });
            localStorage.setItem('server_posts', JSON.stringify(posts));

            this.reset();
            loadPosts();
        });

        function copyIp() {
            const ip = document.getElementById('serverIp').innerText;
            navigator.clipboard.writeText(ip).then(() => {
                const toast = document.getElementById('toast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
        }

        loadPosts();
    </script>
</body>
</html>
