<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SurvivalInKaif — Minecraft Community</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#070b12;--panel:#0f1724;--panel2:#141f30;--line:#223047;--green:#22c55e;--green2:#16a34a}
html{scroll-behavior:smooth}body{background:radial-gradient(circle at 50% -10%,#17263a 0,#070b12 42%);color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}.glass{background:rgba(15,23,36,.82);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.06)}
.card{background:linear-gradient(145deg,#111b2a,#0d1522);border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.18)}
.btn{transition:.18s ease}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.98)}
.input{width:100%;background:#0a111d;border:1px solid #243249;border-radius:14px;padding:12px 14px;color:#fff;outline:none}
.input:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.1)}
.avatar{object-fit:cover;background:#0a111d}.banner{background-size:cover;background-position:center}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#26354b;border-radius:99px}
.hidden-view{display:none!important}.fade{animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="min-h-screen">

<nav class="sticky top-0 z-50 glass">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <button onclick="goHome()" class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-green-500 text-slate-950 font-black text-xl grid place-items-center shadow-lg shadow-green-500/10">S</div>
      <div class="text-left">
        <div class="font-black tracking-tight">Survival<span class="text-green-400">InKaif</span></div>
        <div class="text-[10px] text-slate-500 uppercase tracking-[.2em]">Minecraft Community</div>
      </div>
    </button>
    <div class="hidden md:flex items-center gap-2">
      <button onclick="goHome()" class="px-3 py-2 rounded-xl text-sm text-slate-300 hover:bg-white/5">Главная</button>
      <button onclick="scrollToPlayers()" class="px-3 py-2 rounded-xl text-sm text-slate-300 hover:bg-white/5">Игроки</button>
    </div>
    <div id="navAuth"></div>
  </div>
</nav>

<main id="app" class="max-w-7xl mx-auto px-4 sm:px-6 py-7"></main>

<!-- Auth -->
<div id="authModal" class="fixed inset-0 z-[100] bg-black/70 backdrop-blur-md hidden items-center justify-center p-4">
  <div class="card w-full max-w-md rounded-3xl p-6 relative fade">
    <button onclick="closeAuth()" class="absolute top-4 right-4 w-9 h-9 rounded-xl hover:bg-white/5 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    <div class="mb-6">
      <div class="text-xs text-green-400 font-bold uppercase tracking-widest">SurvivalInKaif</div>
      <h2 id="authTitle" class="text-2xl font-black mt-1">Вход</h2>
      <p id="authSub" class="text-sm text-slate-500 mt-1">Войди, чтобы получить доступ к серверу и профилю.</p>
    </div>
    <div class="flex gap-2 mb-5 p-1 bg-black/20 rounded-xl">
      <button id="loginTab" onclick="setAuthMode('login')" class="flex-1 py-2 rounded-lg bg-green-500 text-slate-950 text-sm font-bold">Вход</button>
      <button id="regTab" onclick="setAuthMode('register')" class="flex-1 py-2 rounded-lg text-slate-400 text-sm font-bold">Регистрация</button>
    </div>
    <form onsubmit="submitAuth(event)" class="space-y-3">
      <div id="nickWrap" class="hidden"><label class="text-xs text-slate-400">Minecraft ник</label><input id="authNick" class="input mt-1" maxlength="16" placeholder="Steve"></div>
      <div><label class="text-xs text-slate-400">Email</label><input id="authEmail" type="email" required class="input mt-1" placeholder="you@example.com"></div>
      <div><label class="text-xs text-slate-400">Пароль</label><input id="authPassword" type="password" minlength="6" required class="input mt-1" placeholder="Минимум 6 символов"></div>
      <p id="authError" class="hidden text-sm text-red-400"></p>
      <button id="authBtn" class="btn w-full bg-green-500 hover:bg-green-400 text-slate-950 py-3 rounded-xl font-black">Войти</button>
    </form>
  </div>
</div>

<!-- Settings -->
<div id="settingsModal" class="fixed inset-0 z-[100] bg-black/70 backdrop-blur-md hidden items-center justify-center p-4 overflow-y-auto">
  <div class="card w-full max-w-2xl rounded-3xl p-6 relative fade my-8">
    <button onclick="closeSettings()" class="absolute top-4 right-4 w-9 h-9 rounded-xl hover:bg-white/5 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    <h2 class="text-2xl font-black">Настройки профиля</h2>
    <p class="text-sm text-slate-500 mt-1 mb-6">Настрой, как тебя видят другие игроки.</p>
    <div class="space-y-5">
      <div>
        <label class="text-xs text-slate-400">Баннер профиля</label>
        <div id="bannerPreview" class="banner h-36 rounded-2xl mt-2 border border-slate-700 overflow-hidden flex items-center justify-center bg-slate-900">
          <span class="text-slate-500 text-sm">Баннер не установлен</span>
        </div>
        <input id="bannerFile" type="file" accept="image/*" class="mt-2 block w-full text-xs text-slate-400">
      </div>
      <div class="grid sm:grid-cols-[120px_1fr] gap-5 items-center">
        <div class="text-center">
          <img id="avatarPreview" class="avatar w-24 h-24 rounded-2xl border-2 border-green-500 mx-auto">
          <input id="avatarFile" type="file" accept="image/*" class="mt-2 w-full text-[10px] text-slate-500">
        </div>
        <div class="space-y-3">
          <div><label class="text-xs text-slate-400">Minecraft ник</label><input id="profileNick" maxlength="16" class="input mt-1"></div>
          <div><label class="text-xs text-slate-400">О себе</label><textarea id="profileBio" maxlength="240" rows="4" class="input mt-1 resize-none" placeholder="Расскажи немного о себе..."></textarea></div>
        </div>
      </div>
      <p id="settingsError" class="hidden text-sm text-red-400"></p>
      <div class="flex justify-end gap-2">
        <button onclick="closeSettings()" class="px-4 py-2.5 rounded-xl text-sm text-slate-400 hover:bg-white/5">Отмена</button>
        <button id="saveProfileBtn" onclick="saveProfile()" class="btn bg-green-500 hover:bg-green-400 text-slate-950 px-5 py-2.5 rounded-xl text-sm font-black">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="fixed bottom-5 right-5 z-[120] hidden bg-green-500 text-slate-950 px-4 py-3 rounded-xl font-bold text-sm shadow-2xl"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,addDoc,query,onSnapshot,updateDoc,deleteDoc,arrayUnion,arrayRemove,serverTimestamp,orderBy} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const firebaseConfig={
 apiKey:"AIzaSyDvi1_IgnU7D6-ZG1r7ULxTJ2Ip7ucNPHo",
 authDomain:"survivalinkaif.firebaseapp.com",
 projectId:"survivalinkaif",
 storageBucket:"survivalinkaif.firebasestorage.app",
 messagingSenderId:"1031638928660",
 appId:"1:1031638928660:web:86178899754cabfa590601",
 measurementId:"G-ZJ7CJQQQGJ"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
let currentUser=null,currentProfile=null,authMode="login",profileCache={};
const fallbackAvatar="https://crafatar.com/renders/head/Steve?overlay";
const defaultBanner="linear-gradient(135deg,#172033,#0b111c)";

const $=id=>document.getElementById(id);
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),2800)}
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function avatar(p){return p?.avatarUrl||`https://crafatar.com/renders/head/${encodeURIComponent(p?.mcNick||"Steve")}?overlay`}
function banner(p){return p?.bannerUrl||""}

async function loadProfile(uid){
 const snap=await getDoc(doc(db,"users",uid));
 if(snap.exists()){profileCache[uid]=snap.data();return snap.data()}
 return null;
}

function nav(){
 const n=$("navAuth");
 if(!currentUser){n.innerHTML=`<div class="flex gap-2"><button onclick="openAuth('login')" class="px-3 py-2 text-sm text-slate-300">Войти</button><button onclick="openAuth('register')" class="bg-green-500 text-slate-950 px-4 py-2 rounded-xl text-sm font-black">Регистрация</button></div>`;return}
 const p=currentProfile||{};
 n.innerHTML=`<div class="flex items-center gap-2">
   <button onclick="openProfile('${currentUser.uid}')" class="flex items-center gap-2 px-2 py-1 rounded-xl hover:bg-white/5">
     <img src="${avatar(p)}" class="w-9 h-9 rounded-xl avatar border border-slate-700">
     <span class="hidden sm:block text-sm font-bold">${esc(p.mcNick||currentUser.displayName||"Игрок")}</span>
   </button>
   <button onclick="openSettings()" class="w-9 h-9 rounded-xl text-slate-400 hover:bg-white/5" title="Настройки"><i class="fa-solid fa-gear"></i></button>
   <button onclick="logout()" class="w-9 h-9 rounded-xl text-slate-400 hover:bg-white/5" title="Выйти"><i class="fa-solid fa-right-from-bracket"></i></button>
 </div>`;
}

async function home(){
 location.hash="";
 $("app").innerHTML=`<div class="fade space-y-7">
   <section class="relative overflow-hidden rounded-3xl border border-slate-800 card p-6 sm:p-10">
     <div class="absolute -right-24 -top-24 w-72 h-72 rounded-full bg-green-500/10 blur-3xl"></div>
     <div class="relative grid lg:grid-cols-[1.35fr_.65fr] gap-8 items-center">
       <div>
         <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-500/10 border border-green-500/20 text-green-400 text-xs font-bold"><span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> PaperMC 1.20+</div>
         <h1 class="text-4xl sm:text-6xl font-black tracking-tight mt-5">Survival<span class="text-green-400">InKaif</span></h1>
         <p class="text-slate-400 mt-3 max-w-xl">Место, где собираются игроки, общаются, делятся моментами и заходят на свой Minecraft-сервер.</p>
         <div class="flex flex-wrap gap-3 mt-7"><button onclick="copyServerIp()" class="btn bg-green-500 hover:bg-green-400 text-slate-950 px-5 py-3 rounded-xl font-black"><i class="fa-regular fa-copy mr-2"></i>Скопировать IP</button><button onclick="scrollToPlayers()" class="btn border border-slate-700 hover:bg-white/5 px-5 py-3 rounded-xl font-bold">Посмотреть игроков</button></div>
       </div>
       <div class="rounded-2xl bg-[#09101b] border border-slate-800 p-5">
         <div class="text-xs text-slate-500 uppercase tracking-widest font-bold">Сервер</div>
         <div class="flex items-center gap-2 mt-3"><span class="w-2.5 h-2.5 bg-green-400 rounded-full animate-pulse"></span><span id="serverStatus" class="font-bold">Проверяем доступ...</span></div>
         <div id="serverIpBox" class="mt-5"></div>
       </div>
     </div>
   </section>
   <section id="playersSection">
     <div class="flex items-end justify-between mb-4"><div><div class="text-xs text-green-400 font-bold uppercase tracking-widest">Community</div><h2 class="text-2xl font-black mt-1">Игроки</h2></div><span id="playerCount" class="text-xs text-slate-500"></span></div>
     <div id="playersGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"><div class="text-slate-500">Загрузка...</div></div>
   </section>
   <section>
     <div class="flex items-end justify-between mb-4"><div><div class="text-xs text-green-400 font-bold uppercase tracking-widest">Community feed</div><h2 class="text-2xl font-black mt-1">Лента</h2></div></div>
     <div id="postsFeed" class="space-y-4"><div class="text-slate-500">Загрузка постов...</div></div>
   </section>
 </div>`;
 await loadServer();
 loadPlayers();
 loadPosts();
}

async function loadServer(){
 if(!currentUser){$("serverStatus").textContent="Только для зарегистрированных";$("serverIpBox").innerHTML=`<button onclick="openAuth('register')" class="w-full bg-white/5 hover:bg-white/10 border border-slate-700 p-4 rounded-xl text-sm font-bold text-slate-300"><i class="fa-solid fa-lock mr-2 text-green-400"></i>Зарегистрируйся, чтобы получить IP</button>`;return}
 try{
  const s=await getDoc(doc(db,"servers","main"));
  if(!s.exists()) throw new Error("SERVER_NOT_FOUND");
  const d=s.data();
  $("serverStatus").textContent=d.online===false?"Сервер офлайн":"Сервер доступен";
  $("serverIpBox").innerHTML=`<div class="flex items-center gap-2 bg-black/30 border border-slate-800 rounded-xl p-2"><code id="ipValue" class="font-mono text-sm font-bold px-2 flex-1 truncate">${esc(d.address||"")}</code><button onclick="copyLoadedIp()" class="bg-green-500 text-slate-950 px-3 py-2 rounded-lg text-xs font-black"><i class="fa-regular fa-copy mr-1"></i>Копировать</button></div>`;
 }catch(e){$("serverStatus").textContent="Не удалось загрузить сервер";$("serverIpBox").innerHTML=`<div class="text-xs text-red-400 bg-red-500/5 border border-red-500/10 rounded-xl p-3">Добавь документ <b>servers/main</b> в Firestore и разреши чтение только авторизованным.</div>`}
}
window.copyServerIp=()=>{if(!currentUser){openAuth("register");return}copyLoadedIp()};
window.copyLoadedIp=async()=>{const ip=$("ipValue")?.textContent?.trim();if(!ip)return;await navigator.clipboard.writeText(ip);toast("IP скопирован!")}
window.scrollToPlayers=()=>document.getElementById("playersSection")?.scrollIntoView({behavior:"smooth"});

async function loadPlayers(){
 const grid=$("playersGrid"); if(!grid)return;
 const q=query(collection(db,"users"));
 onSnapshot(q,snap=>{
  if(!snap.size){grid.innerHTML=`<div class="sm:col-span-2 lg:col-span-3 card rounded-2xl p-8 text-center text-slate-500">Пока нет зарегистрированных игроков.</div>`;return}
  const arr=snap.docs.map(d=>({uid:d.id,...d.data()}));
  $("playerCount").textContent=`${arr.length} ${arr.length===1?"игрок":"игроков"}`;
  grid.innerHTML=arr.map(p=>`<button onclick="openProfile('${p.uid}')" class="card rounded-2xl overflow-hidden text-left hover:border-slate-600 transition">
    <div class="h-20 banner" style="${p.bannerUrl?`background-image:url('${esc(p.bannerUrl)}')`: `background:${defaultBanner}`}"></div>
    <div class="p-4 -mt-8 relative"><img src="${avatar(p)}" class="avatar w-16 h-16 rounded-2xl border-2 border-[#0d1522] shadow-xl"><div class="mt-2 font-black">${esc(p.mcNick||"Игрок")}</div><div class="text-xs text-slate-500 mt-1 line-clamp-2">${esc(p.bio||"Игрок SurvivalInKaif")}</div></div>
  </button>`).join("");
 },e=>{grid.innerHTML=`<div class="text-red-400">Ошибка загрузки игроков.</div>`});
}

function loadPosts(){
 const c=$("postsFeed"); if(!c)return;
 const q=query(collection(db,"posts"));
 onSnapshot(q,snap=>{
  if(!snap.size){c.innerHTML=`<div class="card rounded-2xl p-8 text-center text-slate-500">Пока нет публикаций. Будь первым!</div>`;return}
  const arr=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  c.innerHTML=arr.map(p=>{
   const liked=currentUser&&p.likes?.includes(currentUser.uid);
   const owner=currentUser&&currentUser.uid===p.authorUid;
   const author=profileCache[p.authorUid]||{mcNick:p.author};
   return `<article class="card rounded-2xl p-5">
    <div class="flex justify-between gap-3"><button onclick="openProfile('${p.authorUid}')" class="flex items-center gap-3"><img src="${avatar(author)}" class="avatar w-10 h-10 rounded-xl"><span class="text-left"><b>${esc(p.author||"Игрок")}</b><small class="block text-slate-500">${p.createdAt?.toDate?p.createdAt.toDate().toLocaleString("ru-RU"):"Недавно"}</small></span></button>${owner?`<button onclick="removePost('${p.id}')" class="text-slate-600 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>`:""}</div>
    ${p.text?`<p class="mt-4 whitespace-pre-line text-sm text-slate-200">${esc(p.text)}</p>`:""}
    ${p.mediaUrl?(p.mediaUrl.includes("youtube.com")||p.mediaUrl.includes("youtu.be")?`<div class="mt-4 aspect-video rounded-xl overflow-hidden"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${esc((p.mediaUrl.split("v=")[1]||p.mediaUrl.split("/").pop()).split("&")[0])}" allowfullscreen></iframe></div>`:`<img src="${esc(p.mediaUrl)}" class="mt-4 rounded-xl max-h-[500px] w-full object-cover">`):""}
    <div class="mt-4 pt-3 border-t border-slate-800 flex gap-3"><button onclick='likePost(${JSON.stringify(p.id)},${JSON.stringify(p.likes||[])})' class="${liked?"text-green-400":"text-slate-500"} text-sm font-bold"><i class="${liked?"fa-solid":"fa-regular"} fa-heart mr-1"></i>${(p.likes||[]).length}</button></div>
   </article>`;
  }).join("");
  arr.forEach(p=>p.authorUid&&loadProfile(p.authorUid));
 },e=>console.error(e));
}

window.likePost=async(id,likes)=>{if(!currentUser){openAuth("login");return}const r=doc(db,"posts",id);if(likes.includes(currentUser.uid))await updateDoc(r,{likes:arrayRemove(currentUser.uid)});else await updateDoc(r,{likes:arrayUnion(currentUser.uid)})}
window.removePost=async id=>{if(currentUser&&confirm("Удалить пост?"))await deleteDoc(doc(db,"posts",id))}

window.openProfile=async uid=>{
 const p=profileCache[uid]||await loadProfile(uid);
 if(!p){toast("Профиль не найден");return}
 location.hash=`profile/${uid}`;
 renderProfile(uid,p);
}
function renderProfile(uid,p){
 $("app").innerHTML=`<div class="fade max-w-4xl mx-auto">
  <button onclick="goHome()" class="text-sm text-slate-500 hover:text-white mb-4"><i class="fa-solid fa-arrow-left mr-2"></i>Назад</button>
  <section class="card rounded-3xl overflow-hidden">
   <div class="h-48 sm:h-64 banner" style="${p.bannerUrl?`background-image:url('${esc(p.bannerUrl)}')`:`background:${defaultBanner}`}"></div>
   <div class="p-6 sm:p-8 -mt-16 relative">
    <div class="flex flex-col sm:flex-row sm:items-end gap-4"><img src="${avatar(p)}" class="avatar w-32 h-32 rounded-3xl border-4 border-[#0d1522] shadow-2xl"><div class="flex-1"><div class="text-3xl font-black">${esc(p.mcNick||"Игрок")}</div><div class="text-green-400 text-sm font-bold mt-1">● Игрок SurvivalInKaif</div></div>${currentUser?.uid===uid?`<button onclick="openSettings()" class="btn border border-slate-700 hover:bg-white/5 px-4 py-2.5 rounded-xl text-sm font-bold"><i class="fa-solid fa-gear mr-2"></i>Настроить</button>`:""}</div>
    <div class="mt-7 grid sm:grid-cols-[1fr_auto] gap-6"><div><div class="text-xs text-slate-500 uppercase tracking-widest font-bold">О себе</div><p class="mt-2 text-slate-300 whitespace-pre-line">${esc(p.bio||"Игрок пока ничего не рассказал о себе.")}</p></div><div class="sm:text-right"><div class="text-xs text-slate-500">Регистрация</div><div class="text-sm font-bold mt-1">${p.createdAt?.toDate?p.createdAt.toDate().toLocaleDateString("ru-RU"):"—"}</div></div></div>
   </div>
  </section>
 </div>`;
}

window.goHome=()=>{location.hash="";home()}
window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#profile\\/(.+)$/);if(m)openProfile(m[1]);else home()});

window.openAuth=mode=>{authMode=mode;setAuthMode(mode);$("authModal").classList.remove("hidden");$("authModal").classList.add("flex")}
window.closeAuth=()=>{$("authModal").classList.add("hidden");$("authModal").classList.remove("flex")}
window.setAuthMode=mode=>{authMode=mode;$("authTitle").textContent=mode==="register"?"Создать аккаунт":"Вход";$("authSub").textContent=mode==="register"?"Создай профиль и получи доступ к IP сервера.":"Войди, чтобы продолжить.";$("nickWrap").classList.toggle("hidden",mode!=="register");$("authBtn").textContent=mode==="register"?"Зарегистрироваться":"Войти";$("loginTab").className=mode==="login"?"flex-1 py-2 rounded-lg bg-green-500 text-slate-950 text-sm font-bold":"flex-1 py-2 rounded-lg text-slate-400 text-sm font-bold";$("regTab").className=mode==="register"?"flex-1 py-2 rounded-lg bg-green-500 text-slate-950 text-sm font-bold":"flex-1 py-2 rounded-lg text-slate-400 text-sm font-bold";$("authError").classList.add("hidden")}

window.submitAuth=async e=>{
 e.preventDefault();$("authError").classList.add("hidden");
 const email=$("authEmail").value.trim(),pass=$("authPassword").value,nick=$("authNick").value.trim();
 try{
  if(authMode==="register"){
   if(!/^[A-Za-z0-9_]{3,16}$/.test(nick))throw new Error("Ник: 3–16 символов, только A-Z, 0-9 и _.");
   const r=await createUserWithEmailAndPassword(auth,email,pass);
   await updateProfile(r.user,{displayName:nick});
   await setDoc(doc(db,"users",r.user.uid),{mcNick:nick,bio:"",avatarUrl:`https://crafatar.com/renders/head/${encodeURIComponent(nick)}?overlay`,bannerUrl:"",email:email,createdAt:serverTimestamp()});
   toast("Аккаунт создан!");closeAuth();
  }else{await signInWithEmailAndPassword(auth,email,pass);toast("С возвращением!");closeAuth()}
 }catch(err){$("authError").textContent=err.code==="auth/email-already-in-use"?"Этот email уже зарегистрирован.":err.message;$("authError").classList.remove("hidden")}
}
window.logout=async()=>{await signOut(auth);toast("Вы вышли из аккаунта");goHome()}

window.openSettings=()=>{
 if(!currentUser)return openAuth("login");
 const p=currentProfile||{};
 $("profileNick").value=p.mcNick||currentUser.displayName||"";
 $("profileBio").value=p.bio||"";
 $("avatarPreview").src=avatar(p);
 $("bannerPreview").style.backgroundImage=p.bannerUrl?`url('${p.bannerUrl}')`:"";
 $("bannerPreview").innerHTML=p.bannerUrl?"":`<span class="text-slate-500 text-sm">Баннер не установлен</span>`;
 $("settingsModal").classList.remove("hidden");$("settingsModal").classList.add("flex");
}
window.closeSettings=()=>{$("settingsModal").classList.add("hidden");$("settingsModal").classList.remove("flex")}
window.saveProfile=async()=>{
 const nick=$("profileNick").value.trim(),bio=$("profileBio").value.trim(),err=$("settingsError");
 err.classList.add("hidden");
 if(!/^[A-Za-z0-9_]{3,16}$/.test(nick)){err.textContent="Ник: 3–16 символов, только A-Z, 0-9 и _.";err.classList.remove("hidden");return}
 const btn=$("saveProfileBtn");btn.disabled=true;btn.textContent="Сохраняем...";
 try{
  let avatarUrl=currentProfile?.avatarUrl||`https://crafatar.com/renders/head/${encodeURIComponent(nick)}?overlay`,bannerUrl=currentProfile?.bannerUrl||"";
  const af=$("avatarFile").files[0],bf=$("bannerFile").files[0];
  if(af){const r=ref(storage,`users/${currentUser.uid}/avatar_${Date.now()}`);await uploadBytes(r,af);avatarUrl=await getDownloadURL(r)}
  if(bf){const r=ref(storage,`users/${currentUser.uid}/banner_${Date.now()}`);await uploadBytes(r,bf);bannerUrl=await getDownloadURL(r)}
  await updateProfile(currentUser,{displayName:nick});
  await updateDoc(doc(db,"users",currentUser.uid),{mcNick:nick,bio,avatarUrl,bannerUrl});
  currentProfile=await loadProfile(currentUser.uid);nav();closeSettings();toast("Профиль сохранён!");
  if(location.hash===`#profile/${currentUser.uid}`)renderProfile(currentUser.uid,currentProfile);
 }catch(e){err.textContent="Не удалось сохранить профиль: "+e.message;err.classList.remove("hidden")}
 finally{btn.disabled=false;btn.textContent="Сохранить"}
}

onAuthStateChanged(auth,async u=>{
 currentUser=u;
 currentProfile=u?await loadProfile(u.uid):null;
 nav();
 if(location.hash.startsWith("#profile/"))openProfile(location.hash.split("/")[1]);else home();
});
</script>
</body>
</html>
