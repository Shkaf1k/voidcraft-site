<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvivalInKaif — Сообщество и Сервер Minecraft</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .bg-card { background-color: #1e293b; }
        .bg-card-hover:hover { background-color: #334155; }
        .text-accent { color: #22c55e; }
        .bg-accent { background-color: #22c55e; }
        .bg-accent:hover { background-color: #16a34a; }
        .border-accent { border-color: #22c55e; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Навигация -->
    <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('feed')">
                <div class="w-10 h-10 bg-accent rounded-lg flex items-center justify-center text-slate-950 font-black text-xl">S</div>
                <span class="font-extrabold text-xl tracking-wider text-white">Survival<span class="text-accent">InKaif</span></span>
            </div>
            
            <div class="flex items-center gap-3" id="navAuthSection">
                <!-- Заполняется динамически JS -->
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Левая колонка: Профиль и Сервер -->
        <div class="space-y-6">
            
            <!-- Карточка Сервера -->
            <div class="bg-card p-5 rounded-2xl border border-slate-800 shadow-lg text-center">
                <div class="inline-flex items-center gap-2 bg-slate-900 px-3 py-1 rounded-full text-xs font-semibold text-accent mb-3 border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-accent animate-pulse"></span>
                    PaperMC 1.20+
                </div>
                <h2 class="text-xl font-bold mb-1">Minecraft Сервер</h2>
                <p class="text-xs text-slate-400 mb-4">Подключайся и играй вместе с друзьями!</p>
                
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2 mb-3">
                    <span id="serverIpText" class="font-mono text-sm font-bold text-slate-200 select-all">SurvivalInKaif.aternos.me:50723</span>
                    <button onclick="copyServerIp()" class="bg-accent text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 flex items-center gap-1 shrink-0">
                        <i class="fa-regular fa-copy"></i> Скопировать
                    </button>
                </div>
            </div>

            <!-- Виджет Профиля (если вошел) -->
            <div id="sidebarProfile" class="hidden bg-card p-5 rounded-2xl border border-slate-800 shadow-lg text-center">
                <img id="sidebarAvatar" src="https://crafatar.com/renders/head/steve?overlay" class="w-20 h-20 mx-auto mb-3 rounded-xl shadow-md border-2 border-accent" alt="Skin">
                <h3 id="sidebarMcNick" class="font-bold text-lg text-white">...</h3>
                <p id="sidebarEmail" class="text-xs text-slate-400 mb-4">...</p>
            </div>

        </div>

        <!-- Центральная колонка: Лента / Посты -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Вкладки -->
            <div class="flex gap-2 border-b border-slate-800 pb-2">
                <button id="tabFeedBtn" onclick="switchTab('feed')" class="px-4 py-2 font-bold text-sm rounded-xl bg-accent text-slate-950">Лента Игроков</button>
            </div>

            <!-- Форма создания поста игрока (видны только авторизованным) -->
            <div id="createPostBox" class="hidden bg-card p-4 rounded-2xl border border-slate-800 shadow-lg">
                <div class="flex items-start gap-3">
                    <img id="createPostAvatar" src="https://crafatar.com/renders/head/steve?overlay" class="w-10 h-10 rounded-lg shrink-0">
                    <div class="flex-1 space-y-3">
                        <textarea id="postText" rows="2" placeholder="Поделись скриншотом, видео или сообщением..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-accent resize-none"></textarea>
                        
                        <div class="flex flex-wrap gap-2">
                            <input type="url" id="postMediaUrl" placeholder="Ссылка на скриншот или видео (YouTube)" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
                        </div>

                        <div class="flex justify-end">
                            <button onclick="publishUserPost()" class="bg-accent text-slate-950 font-bold px-5 py-2 rounded-xl text-xs hover:opacity-90 transition">
                                Опубликовать
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Контейнер для постов ленты -->
            <div id="postsFeedContainer" class="space-y-4">
                <div class="text-center py-10 text-slate-500">Загрузка постов...</div>
            </div>

        </div>

    </main>

    <!-- Модальное окно Входа / Регистрации -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-card border border-slate-800 w-full max-w-md p-6 rounded-2xl shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            
            <div class="flex gap-4 mb-6 border-b border-slate-800 pb-2">
                <button id="modalTabLogin" onclick="switchAuthMode('login')" class="font-bold text-lg text-accent border-b-2 border-accent pb-1">Вход</button>
                <button id="modalTabRegister" onclick="switchAuthMode('register')" class="font-bold text-lg text-slate-400 pb-1">Регистрация</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="mcNickGroup" class="hidden">
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Игровой ник в Minecraft</label>
                    <input type="text" id="authMcNick" placeholder="например: Stev1k" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email адрес</label>
                    <input type="email" id="authEmail" required placeholder="your@email.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Пароль</label>
                    <input type="password" id="authPassword" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                </div>

                <p id="authError" class="text-red-400 text-xs hidden"></p>

                <button type="submit" id="authSubmitBtn" class="w-full bg-accent text-slate-950 font-bold py-3 rounded-xl text-sm hover:opacity-90 transition mt-2">
                    Войти
                </button>
            </form>
        </div>
    </div>

    <!-- Уведомления (Toast) -->
    <div id="toast" class="fixed bottom-5 right-5 bg-accent text-slate-950 px-4 py-2.5 rounded-xl font-bold text-xs shadow-xl hidden transition-all z-50">
        Уведомление
    </div>

    <!-- Firebase SDK v9 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, doc, updateDoc, deleteDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // Твои конфиги из Firebase Console
        const firebaseConfig = {
            apiKey: "AIzaSyDvi1_IgnU7D6-ZG1r7ULxTJ2Ip7ucNPHo",
            authDomain: "survivalinkaif.firebaseapp.com",
            projectId: "survivalinkaif",
            storageBucket: "survivalinkaif.firebasestorage.app",
            messagingSenderId: "1031638928660",
            appId: "1:1031638928660:web:86178899754cabfa590601",
            measurementId: "G-ZJ7CJQQQGJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let authMode = 'login';

        // Отслеживание авторизации
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            renderNav();
            if (user) {
                document.getElementById('createPostBox').classList.remove('hidden');
                document.getElementById('sidebarProfile').classList.remove('hidden');
                document.getElementById('sidebarMcNick').innerText = user.displayName || 'Игрок';
                document.getElementById('sidebarEmail').innerText = user.email;
                const skinUrl = `https://crafatar.com/renders/head/${user.displayName || 'steve'}?overlay`;
                document.getElementById('sidebarAvatar').src = skinUrl;
                document.getElementById('createPostAvatar').src = skinUrl;
            } else {
                document.getElementById('createPostBox').classList.add('hidden');
                document.getElementById('sidebarProfile').classList.add('hidden');
            }
        });

        // Навигация верхней панели
        window.renderNav = () => {
            const nav = document.getElementById('navAuthSection');
            if (currentUser) {
                nav.innerHTML = `
                    <div class="flex items-center gap-2">
                        <img src="https://crafatar.com/renders/head/${currentUser.displayName || 'steve'}?overlay" class="w-8 h-8 rounded-lg">
                        <span class="text-xs font-bold text-white hidden sm:inline">${currentUser.displayName || 'Игрок'}</span>
                        <button onclick="handleSignOut()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-semibold ml-2">Выйти</button>
                    </div>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="openAuthModal('login')" class="text-xs font-bold text-slate-300 hover:text-white px-3 py-1.5">Вход</button>
                    <button onclick="openAuthModal('register')" class="bg-accent text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold hover:opacity-90">Регистрация</button>
                `;
            }
        };

        // Авторизация / Регистрация
        window.handleAuthSubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const mcNick = document.getElementById('authMcNick').value.trim();
            const errorEl = document.getElementById('authError');
            errorEl.classList.add('hidden');

            try {
                if (authMode === 'register') {
                    if (!mcNick) throw new Error('Пожалуйста, укажи свой никнейм в Minecraft!');
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(res.user, { displayName: mcNick });
                    showToast('Успешная регистрация!');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    showToast('С возвращением!');
                }
                closeAuthModal();
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.classList.remove('hidden');
            }
        };

        window.handleSignOut = () => {
            signOut(auth);
            showToast('Вы вышли из аккаунта');
        };

        // Публикация поста игроком
        window.publishUserPost = async () => {
            const text = document.getElementById('postText').value.trim();
            const mediaUrl = document.getElementById('postMediaUrl').value.trim();

            if (!text && !mediaUrl) {
                showToast('Заполни текст или прикрепи ссылку!');
                return;
            }

            try {
                await addDoc(collection(db, "posts"), {
                    author: currentUser.displayName || "Неизвестный",
                    authorUid: currentUser.uid,
                    text: text,
                    mediaUrl: mediaUrl,
                    likes: [],
                    createdAt: new Date().toISOString()
                });

                document.getElementById('postText').value = '';
                document.getElementById('postMediaUrl').value = '';
                showToast('Пост опубликован!');
            } catch (err) {
                showToast('Ошибка публикации!');
                console.error(err);
            }
        };

        // Лайки
        window.toggleLike = async (postId, currentLikes) => {
            if (!currentUser) {
                openAuthModal('login');
                return;
            }
            const postRef = doc(db, "posts", postId);
            const hasLiked = currentLikes.includes(currentUser.uid);

            if (hasLiked) {
                await updateDoc(postRef, { likes: arrayRemove(currentUser.uid) });
            } else {
                await updateDoc(postRef, { likes: arrayUnion(currentUser.uid) });
            }
        };

        // Удаление поста
        window.deletePost = async (postId) => {
            if (confirm("Удалить этот пост?")) {
                await deleteDoc(doc(db, "posts", postId));
                showToast("Пост удален");
            }
        };

        // Загрузка Ленты в реальном времени
        const qPosts = query(collection(db, "posts"));
        onSnapshot(qPosts, (snapshot) => {
            const container = document.getElementById('postsFeedContainer');
            if (snapshot.empty) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 bg-card rounded-2xl">Пока нет публикаций. Будь первым!</div>`;
                return;
            }

            let postsArr = [];
            snapshot.forEach(doc => postsArr.push({ id: doc.id, ...doc.data() }));
            postsArr.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

            container.innerHTML = postsArr.map(post => {
                const isLiked = currentUser && post.likes && post.likes.includes(currentUser.uid);
                const isOwner = currentUser && currentUser.uid === post.authorUid;
                const dateStr = new Date(post.createdAt).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

                let mediaHtml = '';
                if (post.mediaUrl) {
                    if (post.mediaUrl.includes('youtube.com') || post.mediaUrl.includes('youtu.be')) {
                        let ytId = post.mediaUrl.split('v=')[1] || post.mediaUrl.split('/').pop();
                        if (ytId.includes('&')) ytId = ytId.split('&')[0];
                        mediaHtml = `<div class="mt-3 aspect-video rounded-xl overflow-hidden"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}" frameborder="0" allowfullscreen></iframe></div>`;
                    } else {
                        mediaHtml = `<img src="${post.mediaUrl}" class="mt-3 rounded-xl max-h-96 w-full object-cover border border-slate-800" onerror="this.style.display='none'">`;
                    }
                }

                return `
                    <div class="bg-card p-5 rounded-2xl border border-slate-800 shadow-lg">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <img src="https://crafatar.com/renders/head/${post.author}?overlay" class="w-9 h-9 rounded-lg">
                                <div>
                                    <h4 class="font-bold text-sm text-white">${post.author}</h4>
                                    <span class="text-xs text-slate-500">${dateStr}</span>
                                </div>
                            </div>
                            ${isOwner ? `<button onclick="deletePost('${post.id}')" class="text-slate-500 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
                        </div>
                        <p class="text-sm text-slate-200 whitespace-pre-line">${post.text}</p>
                        ${mediaHtml}
                        <div class="mt-4 pt-3 border-t border-slate-800/60 flex items-center gap-4 text-xs">
                            <button onclick="toggleLike('${post.id}', ${JSON.stringify(post.likes || [])})" class="flex items-center gap-1.5 font-semibold ${isLiked ? 'text-red-500' : 'text-slate-400 hover:text-slate-200'}">
                                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                                <span>${(post.likes || []).length}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        });

        // Вспомогательное UI
        window.openAuthModal = (mode) => {
            authMode = mode;
            switchAuthMode(mode);
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('authModal').classList.add('flex');
        };

        window.closeAuthModal = () => {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('authModal').classList.remove('flex');
        };

        window.switchAuthMode = (mode) => {
            authMode = mode;
            const nickGrp = document.getElementById('mcNickGroup');
            const btn = document.getElementById('authSubmitBtn');
            const tabLogin = document.getElementById('modalTabLogin');
            const tabReg = document.getElementById('modalTabRegister');

            if (mode === 'register') {
                nickGrp.classList.remove('hidden');
                btn.innerText = "Зарегистрироваться";
                tabReg.className = "font-bold text-lg text-accent border-b-2 border-accent pb-1";
                tabLogin.className = "font-bold text-lg text-slate-400 pb-1";
            } else {
                nickGrp.classList.add('hidden');
                btn.innerText = "Войти";
                tabLogin.className = "font-bold text-lg text-accent border-b-2 border-accent pb-1";
                tabReg.className = "font-bold text-lg text-slate-400 pb-1";
            }
        };

        window.copyServerIp = () => {
            const ip = document.getElementById('serverIpText').innerText;
            navigator.clipboard.writeText(ip);
            showToast('IP скопирован в буфер обмена!');
        };

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        };
    </script>
</body>
</html>
